<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>GIS idToken 테스트</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>textarea{width:100%;height:180px}</style>
  </head>
  <body>
    <h3>Google Identity Services – idToken 받기</h3>
    <div id="g_id_signin"></div>
    <textarea id="out" placeholder="여기에 idToken이 표시됩니다"></textarea>
    <script>
      const CLIENT_ID = "YOUR_CLIENT_ID.apps.googleusercontent.com"; // ← 교체

      function handleCredentialResponse(resp) {
        // resp.credential 이 바로 idToken (JWT)
        document.getElementById("out").value = resp.credential;
        console.log("idToken:", resp.credential);
      }

      window.onload = () => {
        google.accounts.id.initialize({
          client_id: CLIENT_ID,
          callback: handleCredentialResponse,
        });
        // 버튼 렌더(원하면 One Tap도 가능)
        google.accounts.id.renderButton(
          document.getElementById("g_id_signin"),
          { theme: "outline", size: "large" }
        );
        // One Tap 사용하려면 아래도 가능:
        // google.accounts.id.prompt();
      };
    </script>
  </body>
</html>
